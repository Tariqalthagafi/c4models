<svg
  width="200"
  height="160"
  viewBox="0 0 300 220"
  xmlns="http://www.w3.org/2000/svg"
>

  <!-- إطار المتصفح -->
  <rect
    x="20"
    y="20"
    width="260"
    height="180"
    rx="12"
    ry="12"
    stroke="#000"
    stroke-width="8"
    fill="none"
  />

  <!-- الشريط العلوي -->
  <rect
    x="20"
    y="20"
    width="260"
    height="50"
    stroke="#000"
    stroke-width="8"
    fill="none"
  />

  <!-- مربع البحث -->
  <rect
    x="40"
    y="35"
    width="160"
    height="20"
    rx="6"
    ry="6"
    stroke="#000"
    stroke-width="6"
    fill="none"
  />

  <!-- ثلاث نقاط -->
  <circle cx="230" cy="45" r="6" fill="#000" />
  <circle cx="250" cy="45" r="6" fill="#000" />
  <circle cx="270" cy="45" r="6" fill="#000" />

</svg>
